<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BharatPulse | India Smooth Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: radial-gradient(circle at 50% -15%, #2b1d14 0%, #121218 58%, #09090d 100%);
      --glass: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.1);
      --saffron: #f97316;
      --green: #22c55e;
      --text: #f9fafb;
      --muted: #9ca3af;
      --smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1.2rem;
    }

    .app {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.5s var(--smooth);
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .india-tag {
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      background: rgba(249, 115, 22, 0.14);
      border: 1px solid rgba(249, 115, 22, 0.35);
      color: #fdba74;
      font-weight: 600;
    }

    .hero {
      text-align: center;
      margin: 4vh 0 1.8rem;
      transition: all 0.45s var(--smooth);
    }

    .hero h1 {
      font-size: 2.7rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, #fb923c, #ffffff, #4ade80);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: 0.4rem;
    }

    .search-box {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 0.75rem 1rem;
      backdrop-filter: blur(18px);
      transition: all 0.3s var(--smooth);
    }

    .search-box:focus-within {
      border-color: var(--saffron);
      box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.18);
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 1rem;
    }

    .go-btn {
      background: linear-gradient(135deg, var(--saffron), #ea580c);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0.6rem 1.15rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s var(--smooth);
    }

    .go-btn:hover {
      transform: translateY(-1px);
    }

    /* Step Verification Panel */
    .verify-box {
      width: 100%;
      margin-top: 1rem;
      background: rgba(249, 115, 22, 0.08);
      border: 1px solid rgba(249, 115, 22, 0.3);
      border-radius: 16px;
      padding: 1rem 1.2rem;
      display: none;
      flex-direction: column;
      gap: 0.75rem;
    }

    .verify-box.show {
      display: flex;
    }

    .verify-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #fed7aa;
    }

    .verify-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
    }

    .verify-row input {
      width: 120px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.5rem 0.75rem;
      color: var(--text);
      outline: none;
    }

    .verify-btn {
      background: var(--green);
      color: #052e16;
      border: none;
      border-radius: 10px;
      padding: 0.5rem 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .msg {
      font-size: 0.82rem;
      color: #fca5a5;
      min-height: 1rem;
    }

    .msg.ok {
      color: #86efac;
    }

    .results {
      width: 100%;
      margin-top: 1.5rem;
      display: none;
      flex-direction: column;
      gap: 0.9rem;
    }

    .results.show {
      display: flex;
    }

    .card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 1.1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      transition: transform 0.2s var(--smooth), border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(249, 115, 22, 0.45);
    }

    .card h3 {
      font-size: 1rem;
      color: #fdba74;
      margin-bottom: 0.25rem;
    }

    .card p {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .open-link {
      text-decoration: none;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      padding: 0.5rem 0.85rem;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .compact .hero {
      margin: 0.5rem 0 1rem;
    }

    .compact .hero h1 {
      font-size: 1.8rem;
    }

    .compact .hero p {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="top-bar">
      <span class="india-tag">Bharat Edition • India</span>
      <span id="verifyStatus">Step Verification: Pending</span>
    </div>

    <header class="hero">
      <h1>BharatPulse</h1>
      <p>Har query ke liye multiple web sources se instant search</p>
    </header>

    <form class="search-box" id="searchForm">
      <input type="text" id="queryInput" placeholder="Koi bhi jaankari ya topic likhein..." required autocomplete="off">
      <button type="submit" class="go-btn">Search</button>
    </form>

    <div class="verify-box" id="verifyBox">
      <div class="verify-title" id="stepLabel">Step 1/2: Math Verification hal karein</div>
      <div class="verify-row">
        <span id="mathProblem" style="font-weight: 700;"></span>
        <input type="text" id="stepInput" placeholder="Answer / Code" autocomplete="off">
        <button type="button" class="verify-btn" id="verifyBtn">Verify Step</button>
        <button type="button" class="open-link" id="resetVerifyBtn" style="border:none; cursor:pointer;">Naya Code</button>
      </div>
      <div class="msg" id="verifyMsg"></div>
    </div>

    <section class="results" id="resultsSection"></section>
  </div>

  <script>
    const app = document.getElementById('app');
    const searchForm = document.getElementById('searchForm');
    const queryInput = document.getElementById('queryInput');
    const verifyBox = document.getElementById('verifyBox');
    const stepLabel = document.getElementById('stepLabel');
    const mathProblem = document.getElementById('mathProblem');
    const stepInput = document.getElementById('stepInput');
    const verifyBtn = document.getElementById('verifyBtn');
    const resetVerifyBtn = document.getElementById('resetVerifyBtn');
    const verifyMsg = document.getElementById('verifyMsg');
    const verifyStatus = document.getElementById('verifyStatus');
    const resultsSection = document.getElementById('resultsSection');

    let currentStep = 1;
    let expectedMath = 0;
    let expectedToken = "";
    let pendingQuery = "";
    let isVerified = false;

    function setupVerification() {
      currentStep = 1;
      isVerified = false;
      const a = Math.floor(Math.random() * 8) + 2;
      const b = Math.floor(Math.random() * 8) + 2;
      expectedMath = a + b;
      expectedToken = "IN" + Math.floor(100 + Math.random() * 899);

      stepLabel.textContent = "Step 1/2: Math Verification hal karein";
      mathProblem.textContent = `${a} + ${b} = ?`;
      stepInput.value = "";
      stepInput.placeholder = "Jawab likhein";
      verifyMsg.textContent = "";
      verifyMsg.className = "msg";
      verifyStatus.textContent = "Step Verification: Step 1/2";
    }

    setupVerification();

    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = queryInput.value.trim();
      if (!q) return;
      pendingQuery = q;
      app.classList.add('compact');

      if (!isVerified) {
        verifyBox.classList.add('show');
        resultsSection.classList.remove('show');
        stepInput.focus();
      } else {
        renderMultiSiteResults(pendingQuery);
      }
    });

    verifyBtn.addEventListener('click', () => {
      const val = stepInput.value.trim();
      verifyMsg.className = "msg";

      if (currentStep === 1) {
        if (Number(val) === expectedMath) {
          currentStep = 2;
          stepLabel.textContent = `Step 2/2: Token "${expectedToken}" type karein`;
          mathProblem.textContent = `Code: ${expectedToken}`;
          stepInput.value = "";
          stepInput.placeholder = "Token likhein";
          verifyMsg.textContent = "Step 1 pass! Ab Step 2 poora karein.";
          verifyMsg.className = "msg ok";
          verifyStatus.textContent = "Step Verification: Step 2/2";
        } else {
          verifyMsg.textContent = "Step 1 galat hai, sahi jod likhein.";
        }
      } else if (currentStep === 2) {
        if (val.toUpperCase() === expectedToken) {
          isVerified = true;
          verifyBox.classList.remove('show');
          verifyStatus.textContent = "Step Verification: Verified";
          renderMultiSiteResults(pendingQuery);
        } else {
          verifyMsg.textContent = "Step 2 galat hai, upar dikh raha token sahi likhein.";
        }
      }
    });

    resetVerifyBtn.addEventListener('click', () => {
      setupVerification();
      verifyMsg.textContent = "Naya 2-step verification generate ho gaya hai.";
      verifyMsg.className = "msg ok";
    });

    function renderMultiSiteResults(query) {
      const enc = encodeURIComponent(query);
      const sources = [
        {
          name: "Google India Search",
          desc: `"${query}" ke liye Google (.co.in) par web results dekhein`,
          url: `https://www.google.co.in/search?q=${enc}`
        },
        {
          name: "DuckDuckGo Search",
          desc: `"${query}" ke liye DuckDuckGo par general web results dekhein`,
          url: `https://duckduckgo.com/?q=${enc}`
        },
        {
          name: "Bing Search",
          desc: `"${query}" ke liye Bing par pages aur links dekhein`,
          url: `https://www.bing.com/search?q=${enc}`
        },
        {
          name: "Wikipedia Encyclopedia",
          desc: `"${query}" se judi jaankari aur definitions Wikipedia par dekhein`,
          url: `https://en.wikipedia.org/wiki/Special:Search?search=${enc}`
        }
      ];

      resultsSection.innerHTML = "";
      sources.forEach((src) => {
        const card = document.createElement("div");
        card.className = "card";

        const info = document.createElement("div");
        const h3 = document.createElement("h3");
        h3.textContent = src.name;
        const p = document.createElement("p");
        p.textContent = src.desc;
        info.appendChild(h3);
        info.appendChild(p);

        const link = document.createElement("a");
        link.className = "open-link";
        link.href = src.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Open";

        card.appendChild(info);
        card.appendChild(link);
        resultsSection.appendChild(card);
      });

      resultsSection.classList.add("show");
    }
  </script>
</body>
  </html>
