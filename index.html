<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Name – Writing</title>
<style>
:root{--bg:#f7f8fb;--surface:#fff;--text:#1d2433;--muted:#5d677a;--accent:#3b4cca;--line:#dfe3ec}
@media (prefers-color-scheme:dark){:root{--bg:#12151d;--surface:#1a1e29;--text:#e7eaf2;--muted:#9aa3b5;--accent:#8c9bff;--line:#2b3140}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:19px/1.75 Georgia,serif}
a{color:var(--accent)}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}
header{background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding-top:18px;padding-bottom:18px}
.logo{font-weight:700;font-size:1.3rem;color:var(--text);text-decoration:none}
nav a{margin-left:20px;color:var(--muted);text-decoration:none;font:.95rem system-ui,sans-serif}
.intro{padding:56px 0 16px}
.intro h1{font-size:2.5rem;line-height:1.15;margin:0 0 12px}
.intro p{color:var(--muted);margin:0}
.item{padding:26px 0;border-bottom:1px solid var(--line)}
.item h2{font-size:1.5rem;margin:2px 0 6px}
.item h2 a{color:var(--text);text-decoration:none}
.item p{margin:0;color:var(--muted)}
.meta{color:var(--muted);font:.85rem system-ui,sans-serif}
.post,.page{padding:44px 0 56px}
.post h1,.page h1{font-size:2.3rem;line-height:1.2;margin:0 0 8px}
.post h2{font-size:1.5rem;margin:2em 0 .4em}
.post blockquote{margin:1.4em 0;padding-left:18px;border-left:3px solid var(--accent);color:var(--muted);font-style:italic}
.post hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.back{display:inline-block;margin-bottom:22px;font:.95rem system-ui,sans-serif}
footer{padding:32px 0 48px;text-align:center;color:var(--muted);font:.9rem system-ui,sans-serif}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="#home">Your Name</a>
    <nav><a href="#home">Writing</a><a href="#about">About</a></nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer><div class="wrap">© <span id="year"></span> Your Name</div></footer>

<script>
// ✏️ ADD YOUR WRITING HERE. Newest first. Copy one block to add a post.
// In "body" you can use: ## Heading, **bold**, *italic*, [link](https://...), - list, > quote, ---
const posts = [
  {
    slug: "my-first-post",
    title: "My first post",
    date: "2026-11-21",
    summary: "Why I started writing here.",
    body: `Welcome to my writing space. This is my first post.

## Why I write

Writing helps me think. I'll share **essays**, *stories* and short notes here.

> A good sentence is a small act of care.

- Longer essays
- Short stories
- Things I'm reading

Thanks for stopping by.`
  }
];

const aboutText = "Hi, I'm Your Name. I write about the things I notice and care about. Reach me at you@example.com.";

const app = document.getElementById("app");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = d => new Date(d + "T00:00:00").toLocaleDateString(undefined, {year:"numeric", month:"long", day:"numeric"});

function md(src) {
  const inline = t => esc(t)
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>");
  const out = []; let list = false, para = [];
  const fp = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
  const fl = () => { if (list) { out.push("</ul>"); list = false; } };
  for (const line of src.split("\n")) {
    let m;
    if (!line.trim()) { fp(); fl(); }
    else if ((m = line.match(/^##\s+(.*)/))) { fp(); fl(); out.push("<h2>" + inline(m[1]) + "</h2>"); }
    else if (/^---+$/.test(line.trim())) { fp(); fl(); out.push("<hr>"); }
    else if ((m = line.match(/^>\s?(.*)/))) { fp(); fl(); out.push("<blockquote>" + inline(m[1]) + "</blockquote>"); }
    else if ((m = line.match(/^[-*]\s+(.*)/))) { fp(); if (!list) { out.push("<ul>"); list = true; } out.push("<li>" + inline(m[1]) + "</li>"); }
    else { fl(); para.push(line.trim()); }
  }
  fp(); fl();
  return out.join("\n");
}

function home() {
  document.title = "Your Name – Writing";
  const sorted = [...posts].sort((a, b) => b.date.localeCompare(a.date));
  app.innerHTML = `
    <section class="intro"><h1>Writing by Your Name</h1><p>Essays, stories and notes.</p></section>
    ${sorted.map(p => `
      <article class="item">
        <div class="meta">${fmt(p.date)}</div>
        <h2><a href="#post-${p.slug}">${esc(p.title)}</a></h2>
        <p>${esc(p.summary || "")}</p>
      </article>`).join("")}`;
}

function post(slug) {
  const p = posts.find(x => x.slug === slug);
  if (!p) return home();
  document.title = p.title + " – Your Name";
  app.innerHTML = `
    <article class="post">
      <a class="back" href="#home">← All writing</a>
      <h1>${esc(p.title)}</h1>
      <div class="meta">${fmt(p.date)}</div>
      ${md(p.body)}
    </article>`;
}

function about() {
  document.title = "About – Your Name";
  app.innerHTML = `<section class="page"><h1>About</h1><p>${esc(aboutText)}</p></section>`;
}

function route() {
  const h = location.hash.slice(1);
  if (h.startsWith("post-")) post(h.slice(5));
  else if (h === "about") about();
  else home();
  window.scrollTo(0, 0);
}

document.getElementById("year").textContent = new Date().getFullYear();
window.addEventListener("hashchange", route);
route();
</script>
</body>
                                                               </html>
