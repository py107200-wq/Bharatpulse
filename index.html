<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BharatPulse | India Smooth Search & Free Books</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: radial-gradient(circle at 50% -15%, #2b1d14 0%, #121218 58%, #09090d 100%);
      --glass: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.1);
      --saffron: #f97316;
      --green: #22c55e;
      --text: #f9fafb;
      --muted: #9ca3af;
      --smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1.2rem;
    }

    .app {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.5s var(--smooth);
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .india-tag {
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      background: rgba(249, 115, 22, 0.14);
      border: 1px solid rgba(249, 115, 22, 0.35);
      color: #fdba74;
      font-weight: 600;
    }

    .hero {
      text-align: center;
      margin: 4vh 0 1.6rem;
      transition: all 0.45s var(--smooth);
    }

    .hero h1 {
      font-size: 2.7rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, #fb923c, #ffffff, #4ade80);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: var(--muted);
      font-size: 0.92rem;
      margin-top: 0.4rem;
    }

    .mode-switch {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.9rem;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    .mode-btn {
      background: var(--glass);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.45rem 1rem;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s var(--smooth);
    }

    .mode-btn.active {
      background: rgba(249, 115, 22, 0.18);
      border-color: var(--saffron);
      color: #fed7aa;
    }

    .search-box {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 0.75rem 1rem;
      backdrop-filter: blur(18px);
      transition: all 0.3s var(--smooth);
    }

    .search-box:focus-within {
      border-color: var(--saffron);
      box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.18);
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 1rem;
    }

    .go-btn {
      background: linear-gradient(135deg, var(--saffron), #ea580c);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0.6rem 1.15rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s var(--smooth);
    }

    .go-btn:hover {
      transform: translateY(-1px);
    }

    .results {
      width: 100%;
      margin-top: 1.5rem;
      display: none;
      flex-direction: column;
      gap: 0.9rem;
    }

    .results.show {
      display: flex;
    }

    .card {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 1.1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      transition: transform 0.2s var(--smooth), border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(249, 115, 22, 0.45);
    }

    .card h3 {
      font-size: 1rem;
      color: #fdba74;
      margin-bottom: 0.25rem;
    }

    .card p {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .open-link {
      text-decoration: none;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      padding: 0.5rem 0.85rem;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .compact .hero {
      margin: 0.5rem 0 1rem;
    }

    .compact .hero h1 {
      font-size: 1.8rem;
    }

    .compact .hero p {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="top-bar">
      <span class="india-tag">Bharat Edition • India</span>
      <span>Direct Instant Search + Free Books</span>
    </div>

    <header class="hero">
      <h1>BharatPulse</h1>
      <p>Web aur Free Books ke liye multiple sources se instant search</p>
    </header>

    <div class="mode-switch">
      <button type="button" class="mode-btn active" id="modeAll">All Web & Books</button>
      <button type="button" class="mode-btn" id="modeBooks">Free Books Only</button>
    </div>

    <form class="search-box" id="searchForm">
      <input type="text" id="queryInput" placeholder="Book, author ya topic likhein..." required autocomplete="off">
      <button type="submit" class="go-btn">Search</button>
    </form>

    <section class="results" id="resultsSection"></section>
  </div>

  <script>
    const app = document.getElementById('app');
    const searchForm = document.getElementById('searchForm');
    const queryInput = document.getElementById('queryInput');
    const resultsSection = document.getElementById('resultsSection');
    const modeAllBtn = document.getElementById('modeAll');
    const modeBooksBtn = document.getElementById('modeBooks');

    let currentMode = "all";
    let lastQuery = "";

    modeAllBtn.addEventListener('click', () => {
      currentMode = "all";
      modeAllBtn.classList.add('active');
      modeBooksBtn.classList.remove('active');
      if (lastQuery) renderResults(lastQuery);
    });

    modeBooksBtn.addEventListener('click', () => {
      currentMode = "books";
      modeBooksBtn.classList.add('active');
      modeAllBtn.classList.remove('active');
      if (lastQuery) renderResults(lastQuery);
    });

    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = queryInput.value.trim();
      if (!q) return;
      lastQuery = q;
      app.classList.add('compact');
      renderResults(q);
    });

    function renderResults(query) {
      const enc = encodeURIComponent(query);

      const bookSources = [
        {
          name: "Project Gutenberg (Free eBooks)",
          desc: `"${query}" se judi free public-domain books padhein ya download karein`,
          url: `https://www.gutenberg.org/ebooks/search/?query=${enc}`
        },
        {
          name: "Internet Archive Books",
          desc: `"${query}" par free books, archives aur texts Internet Archive mein dekhein`,
          url: `https://archive.org/search?query=${enc}&and[]=mediatype%3A%22texts%22`
        },
        {
          name: "Open Library",
          desc: `"${query}" ke liye Open Library catalog aur free reading options dekhein`,
          url: `https://openlibrary.org/search?q=${enc}`
        },
        {
          name: "Google Books (Free Preview & eBooks)",
          desc: `"${query}" ki books aur free previews Google Books par khojein`,
          url: `https://www.google.co.in/books?q=${enc}`
        }
      ];

      const webSources = [
        {
          name: "Google India Search",
          desc: `"${query}" ke liye Google (.co.in) par web results dekhein`,
          url: `https://www.google.co.in/search?q=${enc}`
        },
        {
          name: "DuckDuckGo Search",
          desc: `"${query}" ke liye DuckDuckGo par general web results dekhein`,
          url: `https://duckduckgo.com/?q=${enc}`
        },
        {
          name: "Bing Search",
          desc: `"${query}" ke liye Bing par pages aur links dekhein`,
          url: `https://www.bing.com/search?q=${enc}`
        },
        {
          name: "Wikipedia Encyclopedia",
          desc: `"${query}" se judi jaankari aur definitions Wikipedia par dekhein`,
          url: `https://en.wikipedia.org/wiki/Special:Search?search=${enc}`
        }
      ];

      const list = currentMode === "books"
        ? bookSources
        : [...bookSources.slice(0, 2), ...webSources];

      resultsSection.innerHTML = "";
      list.forEach((src) => {
        const card = document.createElement("div");
        card.className = "card";

        const info = document.createElement("div");
        const h3 = document.createElement("h3");
        h3.textContent = src.name;
        const p = document.createElement("p");
        p.textContent = src.desc;
        info.appendChild(h3);
        info.appendChild(p);

        const link = document.createElement("a");
        link.className = "open-link";
        link.href = src.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Open";

        card.appendChild(info);
        card.appendChild(link);
        resultsSection.appendChild(card);
      });

      resultsSection.classList.add("show");
    }
  </script>
</body>
  </html>
