<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Name – Stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Noto+Serif+Devanagari:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8fb;--surface:#fff;--text:#1c2433;--muted:#5b6679;--accent:#2f4bb8;--line:#dde2ec}
@media (prefers-color-scheme:dark){:root{--bg:#11151d;--surface:#1a1f2b;--text:#e6e9f1;--muted:#98a2b5;--accent:#8fa0ff;--line:#2a3140}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:19px/1.8 "Noto Serif","Noto Serif Devanagari",Georgia,serif}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:700px;margin:0 auto;padding:0 20px}
header{background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding-top:16px;padding-bottom:16px}
.logo{font-weight:700;font-size:1.3rem;color:var(--text);text-decoration:none}
nav a{margin-left:18px;color:var(--muted);text-decoration:none;font:.95rem system-ui,sans-serif}
nav a:hover{color:var(--accent)}
.intro{padding:52px 0 12px}
.intro h1{font-size:2.4rem;line-height:1.2;margin:0 0 10px}
.intro p{color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 14px;border-radius:99px;font:.9rem system-ui,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.item{padding:24px 0;border-bottom:1px solid var(--line)}
.item h2{font-size:1.45rem;margin:2px 0 6px;line-height:1.35}
.item h2 a{color:var(--text);text-decoration:none}
.item h2 a:hover{color:var(--accent)}
.item p{margin:0;color:var(--muted)}
.meta{color:var(--muted);font:.85rem system-ui,sans-serif}
.tag{margin-left:8px;padding:1px 9px;border:1px solid var(--line);border-radius:99px}
.post,.page{padding:42px 0 60px}
.post h1,.page h1{font-size:2.2rem;line-height:1.25;margin:0 0 8px}
.post h2{font-size:1.5rem;margin:2em 0 .4em}
.post p{margin:1em 0}
.post blockquote{margin:1.4em 0;padding-left:18px;border-left:3px solid var(--accent);color:var(--muted);font-style:italic}
.post hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.back{display:inline-block;margin-bottom:20px;font:.95rem system-ui,sans-serif}
.hint{color:var(--muted);font:.9rem/1.5 system-ui,sans-serif}
.field{width:100%;margin:8px 0;padding:10px 12px;font:1rem system-ui,sans-serif;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:6px}
textarea.field{font:1.05rem/1.7 "Noto Serif","Noto Serif Devanagari",Georgia,serif;min-height:340px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{padding:9px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;font:.95rem system-ui,sans-serif;cursor:pointer}
.btn.alt{background:transparent;color:var(--accent)}
.draft{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font:.95rem system-ui,sans-serif}
.draft button{background:none;border:0;color:var(--muted);cursor:pointer}
footer{padding:30px 0 48px;text-align:center;color:var(--muted);font:.9rem system-ui,sans-serif}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="#home">Your Name</a>
    <nav><a href="#home">Stories</a><a href="#about">About</a><a href="#write">✎ Write</a></nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer><div class="wrap">© <span id="year"></span> Your Name</div></footer>

<script>
/* ================= YOUR SETTINGS ================= */
const siteName = "Your Name";
const categories = ["Short Stories", "Novels", "Kahani", "Poems", "Essays"];
const aboutText = "Hi, I'm Your Name. I write short stories, novels and kahani. Reach me at you@example.com.";

/* ================= YOUR PUBLISHED WRITING =================
   Newest first. To publish: write on the ✎ Write page, tap "Get publish code",
   then paste the block here (keep a comma between blocks).
   In body you can use: ## Heading, **bold**, *italic*, > quote, - list, ---, [link](url)
   Novels: use "## Chapter 1" headings inside one post. */
const posts = [
  {
    slug: "the-last-train",
    title: "The Last Train",
    category: "Short Stories",
    date: "2026-11-21",
    summary: "A woman waits for a train that stopped running years ago.",
    body: `Meera arrived at the station every evening at six.

The station had no staff, no clock, and no trains. But she came anyway, because her father had once said, *"Some things return only when someone is waiting."*

> Waiting is also a way of loving.

One evening, a distant whistle broke the silence.`
  },
  {
    slug: "ek-chhoti-si-kahani",
    title: "एक छोटी सी कहानी",
    category: "Kahani",
    date: "2026-11-20",
    summary: "एक पुराने घर और एक नई उम्मीद की कहानी।",
    body: `गाँव के आख़िरी छोर पर एक पुराना घर था।

कहते थे उस घर में कोई नहीं रहता, पर हर शाम उसकी खिड़की में दीया जलता था।

**एक दिन** एक छोटी लड़की ने हिम्मत करके दरवाज़ा खटखटाया।`
  },
  {
    slug: "river-of-ash",
    title: "River of Ash",
    category: "Novels",
    date: "2026-11-19",
    summary: "A novel in progress about a village by a dying river.",
    body: `## Chapter 1

The river had been shrinking for as long as Arjun could remember.

## Chapter 2

By the time the rains came, half the village had already left.`
  }
];

/* ================= SITE ENGINE (no need to edit) ================= */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = d => new Date(d + "T00:00:00").toLocaleDateString(undefined, {year:"numeric", month:"long", day:"numeric"});
const readTime = t => Math.max(1, Math.round(t.trim().split(/\s+/).length / 200)) + " min read";
let filter = "All";

function md(src) {
  const inline = t => esc(t)
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>");
  const out = []; let list = false, para = [];
  const fp = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
  const fl = () => { if (list) { out.push("</ul>"); list = false; } };
  for (const line of src.split("\n")) {
    let m;
    if (!line.trim()) { fp(); fl(); }
    else if ((m = line.match(/^(#{1,3})\s+(.*)/))) { fp(); fl(); out.push(`<h2>${inline(m[2])}</h2>`); }
    else if (/^---+$/.test(line.trim())) { fp(); fl(); out.push("<hr>"); }
    else if ((m = line.match(/^>\s?(.*)/))) { fp(); fl(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); }
    else if ((m = line.match(/^[-*]\s+(.*)/))) { fp(); if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(m[1])}</li>`); }
    else { fl(); para.push(line.trim()); }
  }
  fp(); fl();
  return out.join("\n");
}

function home() {
  document.title = siteName + " – Stories";
  const sorted = [...posts].sort((a, b) => b.date.localeCompare(a.date));
  const shown = filter === "All" ? sorted : sorted.filter(p => p.category === filter);
  app.innerHTML = `
    <section class="intro"><h1>Stories by ${esc(siteName)}</h1><p>Short stories, novels, kahani and more.</p></section>
    <div class="chips">${["All", ...categories].map(c =>
      `<button class="chip" aria-pressed="${c === filter}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    ${shown.map(p => `
      <article class="item">
        <div class="meta">${fmt(p.date)} · ${readTime(p.body)}<span class="tag">${esc(p.category)}</span></div>
        <h2><a href="#post-${esc(p.slug)}">${esc(p.title)}</a></h2>
        <p>${esc(p.summary || "")}</p>
      </article>`).join("") || '<p class="hint">Nothing here yet.</p>'}`;
  app.querySelectorAll(".chip").forEach(b => b.onclick = () => { filter = b.dataset.c; home(); });
}

function post(slug) {
  const p = posts.find(x => x.slug === slug);
  if (!p) return home();
  document.title = p.title + " – " + siteName;
  app.innerHTML = `
    <article class="post">
      <a class="back" href="#home">← All stories</a>
      <h1>${esc(p.title)}</h1>
      <div class="meta">${fmt(p.date)} · ${readTime(p.body)}<span class="tag">${esc(p.category)}</span></div>
      ${md(p.body)}
    </article>`;
}

function about() {
  document.title = "About – " + siteName;
  app.innerHTML = `<section class="page"><h1>About</h1><p>${esc(aboutText)}</p></section>`;
}

/* ---------- Write page (drafts are saved in YOUR browser only) ---------- */
const store = {
  get() { try { return JSON.parse(localStorage.getItem("drafts") || "[]"); } catch { return []; } },
  set(v) { try { localStorage.setItem("drafts", JSON.stringify(v)); return true; } catch { return false; } }
};

function write(id) {
  document.title = "Write – " + siteName;
  const d = store.get().find(x => x.id === id) || { id: null, title: "", cat: categories[0], summary: "", body: "" };
  app.innerHTML = `
    <section class="page">
      <h1>Write</h1>
      <p class="hint">Your writing saves automatically in this browser. To show it to readers, tap “Get publish code” and paste it into the <b>posts</b> list in index.html on GitHub.</p>
      <input class="field" id="t" placeholder="Title" value="${esc(d.title)}">
      <select class="field" id="c">${categories.map(c => `<option ${c === d.cat ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
      <input class="field" id="s" placeholder="One-line summary" value="${esc(d.summary)}">
      <textarea class="field" id="b" placeholder="Start writing your story…">${esc(d.body)}</textarea>
      <div class="row">
        <button class="btn alt" id="pv">Preview</button>
        <button class="btn" id="pub">Get publish code</button>
        <a class="btn alt" href="#write" style="text-decoration:none">New</a>
      </div>
      <div class="hint" id="st"></div>
      <div id="out"></div>
      <h2>My drafts</h2>
      <div id="dl"></div>
    </section>`;
  const $ = s => app.querySelector(s);

  const drafts = () => {
    const all = store.get();
    $("#dl").innerHTML = all.map(x => `
      <div class="draft"><a href="#write-${x.id}">${esc(x.title || "Untitled")}</a>
      <button data-del="${x.id}" aria-label="Delete draft">Delete</button></div>`).join("") || '<p class="hint">No drafts yet.</p>';
    $("#dl").querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
      if (confirm("Delete this draft?")) { store.set(store.get().filter(x => x.id !== b.dataset.del)); if (d.id === b.dataset.del) location.hash = "#write"; else drafts(); }
    });
  };
  const save = () => {
    d.title = $("#t").value; d.cat = $("#c").value; d.summary = $("#s").value; d.body = $("#b").value;
    if (!d.title && !d.body) return;
    if (!d.id) d.id = Date.now().toString(36);
    const all = store.get(), i = all.findIndex(x => x.id === d.id);
    if (i >= 0) all[i] = d; else all.unshift(d);
    $("#st").textContent = store.set(all) ? "Saved in this browser" : "Couldn't save. Copy your text somewhere safe.";
    drafts();
  };
  ["#t", "#c", "#s", "#b"].forEach(s => $(s).addEventListener("input", save));

  $("#pv").onclick = () => {
    $("#out").innerHTML = `<article class="post"><h1>${esc($("#t").value)}</h1>${md($("#b").value)}</article>`;
  };
  $("#pub").onclick = () => {
    save();
    const title = $("#t").value.trim() || "Untitled";
    const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "story-" + (d.id || Date.now().toString(36));
    const body = $("#b").value.replace(/\\/g, "\\\\").replace(/`/g, "\\`").replace(/\$\{/g, "\\${");
    const code = `  {\n    slug: ${JSON.stringify(slug)},\n    title: ${JSON.stringify(title)},\n    category: ${JSON.stringify($("#c").value)},\n    date: "${new Date().toISOString().slice(0, 10)}",\n    summary: ${JSON.stringify($("#s").value)},\n    body: \`${body}\`\n  },`;
    $("#out").innerHTML = `<p class="hint">Paste this inside the <b>posts</b> list (at the top):</p><textarea class="field" id="code" style="min-height:200px;font:.85rem monospace" readonly>${esc(code)}</textarea><div class="row"><button class="btn" id="cp">Copy code</button></div>`;
    $("#cp").onclick = async () => {
      const ta = $("#code"); ta.select();
      try { await navigator.clipboard.writeText(code); $("#cp").textContent = "Copied"; } catch { document.execCommand("copy"); }
    };
  };
  drafts();
}

function route() {
  const h = location.hash.slice(1);
  if (h.startsWith("post-")) post(h.slice(5));
  else if (h.startsWith("write")) write(h.slice(6));
  else if (h === "about") about();
  else home();
  window.scrollTo(0, 0);
}

document.getElementById("year").textContent = new Date().getFullYear();
window.addEventListener("hashchange", route);
route();
</script>
</body>
                              </html>
